<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helpdesk Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f9f8;
      --surface: #ffffff;
      --surface-alt: #f3f3f1;
      --border: rgba(0,0,0,0.10);
      --border-strong: rgba(0,0,0,0.20);
      --text: #1a1a18;
      --text-muted: #6b6b67;
      --text-faint: #9b9b96;
      --blue: #185FA5;
      --blue-bg: #E6F1FB;
      --blue-text: #0C447C;
      --amber: #BA7517;
      --amber-bg: #FAEEDA;
      --amber-text: #633806;
      --green: #3B6D11;
      --green-bg: #EAF3DE;
      --green-text: #27500A;
      --red: #A32D2D;
      --red-bg: #FCEBEB;
      --red-text: #791F1F;
      --gray-bg: #F1EFE8;
      --gray-text: #444441;
      --radius: 8px;
      --radius-lg: 12px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'Consolas', 'Courier New', monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a18;
        --surface: #242422;
        --surface-alt: #2e2e2b;
        --border: rgba(255,255,255,0.10);
        --border-strong: rgba(255,255,255,0.20);
        --text: #f0f0ee;
        --text-muted: #a0a09c;
        --text-faint: #6b6b67;
        --blue-bg: #0c2d4a;
        --blue-text: #85B7EB;
        --amber-bg: #3a2500;
        --amber-text: #FAC775;
        --green-bg: #172a06;
        --green-text: #C0DD97;
        --red-bg: #2a0f0f;
        --red-text: #F7C1C1;
        --gray-bg: #2c2c2a;
        --gray-text: #B4B2A9;
      }
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Layout */
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 220px;
      background: var(--surface);
      border-right: 0.5px solid var(--border);
      padding: 1.5rem 1rem;
      display: flex; flex-direction: column; gap: 4px;
      z-index: 10;
    }

    .sidebar-logo {
      font-size: 16px; font-weight: 600;
      color: var(--text);
      padding: 0 0.5rem 1.25rem;
      border-bottom: 0.5px solid var(--border);
      margin-bottom: 0.5rem;
      display: flex; align-items: center; gap: 8px;
    }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius);
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      border: none; background: none; width: 100%; text-align: left;
      text-decoration: none;
    }
    .nav-item:hover { background: var(--surface-alt); color: var(--text); }
    .nav-item.active { background: var(--blue-bg); color: var(--blue-text); font-weight: 500; }
    .nav-item i { font-size: 18px; }

    .main { margin-left: 220px; padding: 2rem; max-width: 1100px; }

    /* Top bar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.75rem; flex-wrap: wrap; gap: 12px;
    }
    .topbar h1 { font-size: 20px; font-weight: 600; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    #clock { font-size: 13px; color: var(--text-muted); }

    /* Metrics */
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 1.75rem; }
    .metric {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem 1.25rem;
    }
    .metric-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .metric-value { font-size: 28px; font-weight: 600; }
    .mv-blue { color: var(--blue); }
    .mv-amber { color: var(--amber); }
    .mv-green { color: var(--green); }
    .mv-red { color: var(--red); }

    /* Buttons */
    button, .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-size: 13px; font-family: var(--font);
      cursor: pointer;
      transition: background 0.1s;
    }
    button:hover { background: var(--surface-alt); }
    button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    button.primary:hover { background: var(--blue-text); }

    /* Form elements */
    input, select, textarea {
      background: var(--surface);
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 7px 10px;
      font-size: 13px; font-family: var(--font);
      color: var(--text);
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(24,95,165,0.12);
    }

    /* Controls bar */
    .controls { display: flex; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
    .controls input { flex: 1; min-width: 180px; }

    /* New ticket form */
    .new-form {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .new-form.open { display: block; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .form-full { grid-column: 1 / -1; }
    .form-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .form-group { display: flex; flex-direction: column; }

    /* Ticket list */
    .ticket-list { display: flex; flex-direction: column; gap: 8px; }
    .ticket {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem 1.25rem;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .ticket:hover { border-color: var(--border-strong); }
    .ticket.selected { border-color: var(--blue); border-width: 1.5px; }
    .ticket-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
    .ticket-id { font-size: 12px; color: var(--text-faint); font-family: var(--mono); }
    .ticket-title { font-size: 14px; font-weight: 500; flex: 1; min-width: 120px; }
    .ticket-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 14px; flex-wrap: wrap; }
    .ticket-meta i { font-size: 12px; vertical-align: -1px; }

    /* Badges */
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
    .badge.open    { background: var(--blue-bg);  color: var(--blue-text); }
    .badge.in-progress { background: var(--amber-bg); color: var(--amber-text); }
    .badge.resolved    { background: var(--green-bg); color: var(--green-text); }
    .badge.closed      { background: var(--gray-bg);  color: var(--gray-text); }
    .badge.low    { background: var(--green-bg); color: var(--green-text); }
    .badge.medium { background: var(--amber-bg); color: var(--amber-text); }
    .badge.high   { background: var(--red-bg);   color: var(--red-text); }
    .badge.urgent { background: var(--red-bg);   color: var(--red-text); font-weight: 700; }

    /* Detail panel */
    .detail-panel {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-top: 1rem;
    }
    .detail-panel h2 { font-size: 17px; font-weight: 600; margin-bottom: 1.25rem; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; margin-bottom: 1.25rem; }
    .detail-field label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 4px; }
    .detail-field .val { font-size: 14px; color: var(--text); }
    .desc-block { background: var(--surface-alt); border-radius: var(--radius); padding: 12px; font-size: 14px; line-height: 1.6; margin-bottom: 1.25rem; }
    .detail-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.25rem; }
    textarea.note { width: 100%; min-height: 72px; resize: vertical; font-size: 13px; margin-bottom: 10px; }

    /* Activity log */
    .activity { border-top: 0.5px solid var(--border); padding-top: 1rem; }
    .activity-label { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .activity-item { font-size: 13px; color: var(--text-muted); padding: 5px 0; border-bottom: 0.5px solid var(--border); display: flex; gap: 8px; align-items: flex-start; }
    .activity-item:last-child { border-bottom: none; }
    .activity-item i { font-size: 14px; margin-top: 1px; flex-shrink: 0; }

    /* Empty state */
    .empty { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
    .empty i { font-size: 36px; display: block; margin-bottom: 12px; color: var(--text-faint); }

    /* Section header */
    .section-header { font-size: 11px; font-weight: 500; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }

    @media (max-width: 700px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 1rem; }
      .form-grid { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="sidebar" role="navigation" aria-label="Main navigation">
  <div class="sidebar-logo">
    <i class="ti ti-headset" aria-hidden="true"></i> Helpdesk
  </div>
  <button class="nav-item active" onclick="showView('tickets')">
    <i class="ti ti-ticket" aria-hidden="true"></i> Tickets
  </button>
  <button class="nav-item" onclick="showView('stats')">
    <i class="ti ti-chart-bar" aria-hidden="true"></i> Overview
  </button>
  <div style="margin-top: auto; padding-top: 1rem; border-top: 0.5px solid var(--border);">
    <div style="font-size: 12px; color: var(--text-faint); padding: 0 0.5rem;">
      <div style="font-weight: 500; color: var(--text-muted); margin-bottom: 2px;">IT Support</div>
      Demo Environment
    </div>
  </div>
</nav>

<main class="main" id="main">

  <!-- TICKETS VIEW -->
  <div id="view-tickets">
    <div class="topbar">
      <div>
        <h1>Tickets</h1>
        <div id="clock" style="margin-top:2px;"></div>
      </div>
      <div class="topbar-right">
        <button class="primary" onclick="toggleForm()" id="new-btn">
          <i class="ti ti-plus" aria-hidden="true"></i> New ticket
        </button>
      </div>
    </div>

    <div class="metrics">
      <div class="metric"><div class="metric-label">Open</div><div class="metric-value mv-blue" id="m-open">0</div></div>
      <div class="metric"><div class="metric-label">In progress</div><div class="metric-value mv-amber" id="m-prog">0</div></div>
      <div class="metric"><div class="metric-label">Resolved</div><div class="metric-value mv-green" id="m-res">0</div></div>
      <div class="metric"><div class="metric-label">Urgent</div><div class="metric-value mv-red" id="m-urg">0</div></div>
    </div>

    <div class="new-form" id="new-form">
      <div class="section-header" style="margin-bottom:14px;">New ticket</div>
      <div class="form-grid">
        <div class="form-group">
          <div class="form-label">Issue title *</div>
          <input type="text" id="f-title" placeholder="e.g. Laptop won't connect to VPN" />
        </div>
        <div class="form-group">
          <div class="form-label">Submitted by *</div>
          <input type="text" id="f-user" placeholder="Full name" />
        </div>
        <div class="form-group">
          <div class="form-label">Category</div>
          <select id="f-category">
            <option>Hardware</option>
            <option>Software</option>
            <option>Network</option>
            <option>Account</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <div class="form-label">Priority</div>
          <select id="f-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
        <div class="form-group form-full">
          <div class="form-label">Description</div>
          <textarea id="f-desc" placeholder="Describe the issue in detail..." style="min-height:72px;resize:vertical;"></textarea>
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="primary" onclick="submitTicket()"><i class="ti ti-check" aria-hidden="true"></i> Submit</button>
        <button onclick="toggleForm()">Cancel</button>
      </div>
    </div>

    <div class="controls">
      <input type="text" id="search" placeholder="Search by title, user, or ID..." oninput="renderTickets()" aria-label="Search tickets" />
      <select id="filter-status" onchange="renderTickets()" aria-label="Filter by status">
        <option value="all">All statuses</option>
        <option value="open">Open</option>
        <option value="in-progress">In progress</option>
        <option value="resolved">Resolved</option>
        <option value="closed">Closed</option>
      </select>
      <select id="filter-priority" onchange="renderTickets()" aria-label="Filter by priority">
        <option value="all">All priorities</option>
        <option value="urgent">Urgent</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <button onclick="exportCSV()" title="Export tickets to CSV"><i class="ti ti-download" aria-hidden="true"></i> Export CSV</button>
    </div>

    <div class="section-header" id="ticket-count"></div>
    <div class="ticket-list" id="ticket-list"></div>
    <div class="detail-panel" id="detail-panel" style="display:none;" aria-live="polite"></div>
  </div>

  <!-- STATS VIEW -->
  <div id="view-stats" style="display:none;">
    <div class="topbar">
      <h1>Overview</h1>
    </div>
    <div id="stats-content"></div>
  </div>

</main>

<script>
let tickets = [
  { id:'TK-001', title:"Laptop won't connect to VPN", user:'Sarah Chen', category:'Network', priority:'high', status:'open', desc:"Getting 'authentication failed' error when trying to connect to company VPN. Issue started after this morning's update.", created:'2025-06-11 08:14', activity:['Ticket opened by Sarah Chen'] },
  { id:'TK-002', title:'Password reset email not arriving', user:'James Ortiz', category:'Account', priority:'urgent', status:'in-progress', desc:"Password reset email is not arriving. Checked spam folder. Currently locked out of Salesforce and unable to complete client calls.", created:'2025-06-11 08:47', activity:['Ticket opened by James Ortiz','Status changed to in-progress','Note: Checked mail logs — delivery confirmed. Investigating spam filters.'] },
  { id:'TK-003', title:'Second monitor flickering', user:'Alex Rivera', category:'Hardware', priority:'medium', status:'open', desc:'Right-side monitor flickers every few minutes, mainly when Chrome is open. Left monitor is fine.', created:'2025-06-11 09:02', activity:['Ticket opened by Alex Rivera'] },
  { id:'TK-004', title:'Outlook calendar not syncing', user:'Dana Lee', category:'Software', priority:'low', status:'resolved', desc:'Calendar shows last week\'s events and is not pulling in new meetings added by colleagues.', created:'2025-06-10 15:30', activity:['Ticket opened by Dana Lee','Status changed to in-progress','Note: Re-added Exchange account. Sync restored.','Status changed to resolved'] },
  { id:'TK-005', title:'Shared printer offline — 3rd floor', user:'Marcus Webb', category:'Hardware', priority:'medium', status:'open', desc:'HP shared printer on 3rd floor showing offline to all users since 8am. Restart did not resolve.', created:'2025-06-11 09:45', activity:['Ticket opened by Marcus Webb'] },
  { id:'TK-006', title:'New employee account setup', user:'HR Department', category:'Account', priority:'high', status:'open', desc:'New hire starting Monday. Need email, Slack, and system access configured by end of Friday.', created:'2025-06-11 10:10', activity:['Ticket opened by HR Department'] },
];
let selected = null;
let nextId = 7;

function pad(n){ return String(n).padStart(2,'0'); }

function tick(){
  const n = new Date();
  const el = document.getElementById('clock');
  if(el) el.textContent = n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}) + ' · ' + pad(n.getHours())+':'+pad(n.getMinutes());
}
tick(); setInterval(tick, 30000);

function showView(v){
  document.getElementById('view-tickets').style.display = v==='tickets' ? 'block' : 'none';
  document.getElementById('view-stats').style.display = v==='stats' ? 'block' : 'none';
  document.querySelectorAll('.nav-item').forEach((el,i)=>{
    el.classList.toggle('active', (v==='tickets'&&i===0)||(v==='stats'&&i===1));
  });
  if(v==='stats') renderStats();
}

function updateMetrics(){
  document.getElementById('m-open').textContent = tickets.filter(t=>t.status==='open').length;
  document.getElementById('m-prog').textContent = tickets.filter(t=>t.status==='in-progress').length;
  document.getElementById('m-res').textContent  = tickets.filter(t=>t.status==='resolved').length;
  document.getElementById('m-urg').textContent  = tickets.filter(t=>t.priority==='urgent').length;
}

function labelStatus(s){ return s==='in-progress'?'In progress':s.charAt(0).toUpperCase()+s.slice(1); }
function labelPriority(p){ return p.charAt(0).toUpperCase()+p.slice(1); }

function renderTickets(){
  const search = document.getElementById('search').value.toLowerCase();
  const fs = document.getElementById('filter-status').value;
  const fp = document.getElementById('filter-priority').value;
  const filtered = tickets.filter(t=>{
    if(fs!=='all' && t.status!==fs) return false;
    if(fp!=='all' && t.priority!==fp) return false;
    if(search && !t.title.toLowerCase().includes(search) && !t.user.toLowerCase().includes(search) && !t.id.toLowerCase().includes(search)) return false;
    return true;
  });

  const count = document.getElementById('ticket-count');
  count.textContent = filtered.length + ' ticket' + (filtered.length!==1?'s':'') + ' shown';

  const list = document.getElementById('ticket-list');
  if(!filtered.length){
    list.innerHTML = '<div class="empty"><i class="ti ti-inbox" aria-hidden="true"></i>No tickets match your filters</div>';
    updateMetrics(); return;
  }

  list.innerHTML = filtered.map(t=>`
    <div class="ticket${selected===t.id?' selected':''}" onclick="selectTicket('${t.id}')" role="button" tabindex="0" aria-label="Ticket ${t.id}: ${t.title}">
      <div class="ticket-header">
        <span class="ticket-id">${t.id}</span>
        <span class="ticket-title">${t.title}</span>
        <span class="badge ${t.status}">${labelStatus(t.status)}</span>
        <span class="badge ${t.priority}">${labelPriority(t.priority)}</span>
      </div>
      <div class="ticket-meta">
        <span><i class="ti ti-user" aria-hidden="true"></i> ${t.user}</span>
        <span><i class="ti ti-tag" aria-hidden="true"></i> ${t.category}</span>
        <span><i class="ti ti-clock" aria-hidden="true"></i> ${t.created}</span>
      </div>
    </div>`).join('');
  updateMetrics();
}

function selectTicket(id){
  selected = id;
  const t = tickets.find(x=>x.id===id);
  const panel = document.getElementById('detail-panel');
  panel.style.display = 'block';
  panel.innerHTML = `
    <h2>${t.title}</h2>
    <div class="detail-grid">
      <div class="detail-field"><label>Ticket ID</label><div class="val" style="font-family:var(--mono);font-size:13px;">${t.id}</div></div>
      <div class="detail-field"><label>Submitted by</label><div class="val">${t.user}</div></div>
      <div class="detail-field"><label>Category</label><div class="val">${t.category}</div></div>
      <div class="detail-field"><label>Created</label><div class="val">${t.created}</div></div>
      <div class="detail-field"><label>Priority</label><div class="val"><span class="badge ${t.priority}">${labelPriority(t.priority)}</span></div></div>
      <div class="detail-field"><label>Status</label><div class="val"><span class="badge ${t.status}">${labelStatus(t.status)}</span></div></div>
    </div>
    <div class="form-label" style="margin-bottom:6px;">Description</div>
    <div class="desc-block">${t.desc}</div>
    <div class="detail-actions">
      <button onclick="updateStatus('in-progress')"><i class="ti ti-player-play" aria-hidden="true"></i> Start</button>
      <button onclick="updateStatus('resolved')"><i class="ti ti-check" aria-hidden="true"></i> Resolve</button>
      <button onclick="updateStatus('closed')"><i class="ti ti-x" aria-hidden="true"></i> Close</button>
    </div>
    <div class="form-label" style="margin-bottom:6px;">Add note</div>
    <textarea class="note" id="note-input" placeholder="Document what you did, findings, or next steps..."></textarea>
    <button onclick="addNote()"><i class="ti ti-message" aria-hidden="true"></i> Save note</button>
    <div class="activity" style="margin-top:1.25rem;">
      <div class="activity-label">Activity log</div>
      ${t.activity.map(a=>`<div class="activity-item"><i class="ti ti-point" aria-hidden="true"></i>${a}</div>`).join('')}
    </div>`;
  panel.scrollIntoView({ behavior:'smooth', block:'nearest' });
  renderTickets();
}

function updateStatus(status){
  if(!selected) return;
  const t = tickets.find(x=>x.id===selected);
  t.status = status;
  t.activity.push('Status changed to ' + status);
  selectTicket(selected);
}

function addNote(){
  if(!selected) return;
  const note = document.getElementById('note-input').value.trim();
  if(!note) return;
  const t = tickets.find(x=>x.id===selected);
  t.activity.push('Note: ' + note);
  selectTicket(selected);
}

function toggleForm(){
  const f = document.getElementById('new-form');
  f.classList.toggle('open');
  const btn = document.getElementById('new-btn');
  btn.innerHTML = f.classList.contains('open')
    ? '<i class="ti ti-x" aria-hidden="true"></i> Cancel'
    : '<i class="ti ti-plus" aria-hidden="true"></i> New ticket';
}

function submitTicket(){
  const title = document.getElementById('f-title').value.trim();
  const user  = document.getElementById('f-user').value.trim();
  if(!title||!user){ alert('Please fill in the issue title and submitter name.'); return; }
  const now = new Date();
  const ts = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const id = 'TK-' + String(nextId++).padStart(3,'0');
  tickets.unshift({
    id, title, user,
    category: document.getElementById('f-category').value,
    priority: document.getElementById('f-priority').value,
    status: 'open',
    desc: document.getElementById('f-desc').value || 'No description provided.',
    created: ts,
    activity: ['Ticket opened by ' + user]
  });
  document.getElementById('f-title').value = '';
  document.getElementById('f-user').value  = '';
  document.getElementById('f-desc').value  = '';
  toggleForm();
  renderTickets();
}

function exportCSV(){
  const headers = ['ID','Title','User','Category','Priority','Status','Created'];
  const rows = tickets.map(t=>[t.id,`"${t.title}"`,t.user,t.category,t.priority,t.status,t.created]);
  const csv = [headers, ...rows].map(r=>r.join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tickets.csv';
  a.click();
}

function renderStats(){
  const total = tickets.length;
  const byStatus = {};
  const byCategory = {};
  const byPriority = {};
  tickets.forEach(t=>{
    byStatus[t.status] = (byStatus[t.status]||0)+1;
    byCategory[t.category] = (byCategory[t.category]||0)+1;
    byPriority[t.priority] = (byPriority[t.priority]||0)+1;
  });

  function bar(label, count, total, colorClass){
    const pct = Math.round((count/total)*100);
    return `<div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
        <span>${label}</span><span style="color:var(--text-muted);">${count} (${pct}%)</span>
      </div>
      <div style="background:var(--surface-alt);border-radius:4px;height:8px;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:var(--${colorClass});border-radius:4px;"></div>
      </div></div>`;
  }

  const statusColors = {open:'blue',['in-progress']:'amber',resolved:'green',closed:'text-faint'};
  const priColors = {urgent:'red',high:'red',medium:'amber',low:'green'};

  document.getElementById('stats-content').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.25rem;">
      <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;">
        <div class="section-header" style="margin-bottom:1rem;">By status</div>
        ${Object.entries(byStatus).map(([k,v])=>bar(labelStatus(k),v,total,statusColors[k]||'blue')).join('')}
      </div>
      <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;">
        <div class="section-header" style="margin-bottom:1rem;">By category</div>
        ${Object.entries(byCategory).map(([k,v])=>bar(k,v,total,'blue')).join('')}
      </div>
      <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;">
        <div class="section-header" style="margin-bottom:1rem;">By priority</div>
        ${Object.entries(byPriority).map(([k,v])=>bar(labelPriority(k),v,total,priColors[k]||'blue')).join('')}
      </div>
    </div>
    <div style="margin-top:1.25rem;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;">
      <div class="section-header" style="margin-bottom:1rem;">All tickets</div>
      <table style="width:100%;font-size:13px;border-collapse:collapse;">
        <thead>
          <tr style="text-align:left;color:var(--text-muted);border-bottom:0.5px solid var(--border);">
            <th style="padding:6px 8px;">ID</th><th style="padding:6px 8px;">Title</th>
            <th style="padding:6px 8px;">User</th><th style="padding:6px 8px;">Category</th>
            <th style="padding:6px 8px;">Priority</th><th style="padding:6px 8px;">Status</th>
          </tr>
        </thead>
        <tbody>
          ${tickets.map(t=>`<tr style="border-bottom:0.5px solid var(--border);">
            <td style="padding:7px 8px;font-family:var(--mono);color:var(--text-faint);">${t.id}</td>
            <td style="padding:7px 8px;">${t.title}</td>
            <td style="padding:7px 8px;color:var(--text-muted);">${t.user}</td>
            <td style="padding:7px 8px;color:var(--text-muted);">${t.category}</td>
            <td style="padding:7px 8px;"><span class="badge ${t.priority}">${labelPriority(t.priority)}</span></td>
            <td style="padding:7px 8px;"><span class="badge ${t.status}">${labelStatus(t.status)}</span></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

renderTickets();
</script>
</body>
</html>
